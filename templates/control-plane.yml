version: 1

repository:
  base_branch: REPLACE_ME
  implementer_authors:
    - REPLACE_ME

issue_contract:
  frozen_spec_label: frozen-spec
  active_coordination_labels:
    - agent-ready
    - agent-working
    - changes-requested
  terminal_coordination_labels:
    - infra-blocked
    - needs-human
  max_request_changes_rounds: 3

reviewer:
  transport: chatgpt-work-github-webhook-task
  events:
    - pull_request.opened
    - pull_request.ready_for_review
    - pull_request.synchronize
    - check_run.completed
  exact_head_sha_required: true
  required_checks:
    # Consumer-owned: list this repository's actual branch protection checks.
    # Each result is accepted only for the current PR head SHA.
    - name: REPLACE_ME
      accepted_conclusions:
        - success

merge:
  native_auto_merge: true
  method: REPLACE_ME # merge, squash, or rebase according to repository policy
  direct_merge_forbidden: true
  admin_bypass_forbidden_in_normal_flow: true
